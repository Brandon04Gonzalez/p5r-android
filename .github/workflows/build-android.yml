name: Android Runtime Build Check

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "runtime/**"
      - "android/wonder/importer/**"
      - "games/p5r/**"
      - "games/jjk/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  runtime-tests:
    name: Host runtime tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure tests
        run: cmake -S . -B build -G Ninja -DNX_TESTS=ON

      - name: Build tests
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure


  android-importer-cli:
    name: Android ARM64 game-inspection CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Compile importer for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_NDK_HOME"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CXX" --target=aarch64-linux-android29 -std=c++17 -O2 -static-libstdc++ \
            -Wall -Wextra \
            -o nximport-arm64 \
            android/wonder/importer/nximport_cli.cpp \
            android/wonder/importer/nximport.cpp \
            android/wonder/importer/nxcrypto.cpp
          file nximport-arm64
          readelf -h nximport-arm64 | grep -E 'Class:|Machine:'

      - name: Upload Android importer CLI
        uses: actions/upload-artifact@v4
        with:
          name: jjk-inspector-android-arm64
          path: nximport-arm64
          if-no-files-found: error
          retention-days: 7

  android-nce:
    name: Android ARM64 runtime compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git

      - name: Get Vulkan headers
        run: |
          mkdir -p private/third_party
          git clone --depth 1 --branch v1.4.357 https://github.com/KhronosGroup/Vulkan-Headers.git private/third_party/Vulkan-Headers-1.4.357
          ln -s include private/third_party/Vulkan-Headers-1.4.357/Include

      - name: Configure Android ARM64 native execution build
        env:
          VULKAN_SDK: ${{ github.workspace }}/private/third_party/Vulkan-Headers-1.4.357
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DNX_GAME=p5r \
            -DNX_NCE=ON \
            -DNX_RELEASE=ON

      - name: Compile Android native library
        run: cmake --build build-android --target p5r --parallel 2

      - name: Upload native library for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p5r-android-arm64-runtime-check
          path: build-android/libp5r.so
          if-no-files-found: error
          retention-days: 3


  jjk-metadata-check:
    name: JJK target metadata compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile JJK game metadata
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsyntax-only -Iruntime/include games/jjk/game.cpp


  android-jjk-nce:
    name: Android ARM64 JJK runtime compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git

      - name: Get Vulkan headers
        run: |
          mkdir -p private/third_party
          git clone --depth 1 --branch v1.4.357 https://github.com/KhronosGroup/Vulkan-Headers.git private/third_party/Vulkan-Headers-1.4.357
          ln -s include private/third_party/Vulkan-Headers-1.4.357/Include

      - name: Configure JJK Android ARM64 native execution build
        env:
          VULKAN_SDK: ${{ github.workspace }}/private/third_party/Vulkan-Headers-1.4.357
        run: |
          cmake -S . -B build-jjk-android -G Ninja \\
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \\
            -DANDROID_ABI=arm64-v8a \\
            -DANDROID_PLATFORM=android-29 \\
            -DANDROID_STL=c++_static \\
            -DNX_GAME=jjk \\
            -DNX_NCE=ON \\
            -DNX_RELEASE=ON

      - name: Compile JJK native library
        run: cmake --build build-jjk-android --target jjk --parallel 2
